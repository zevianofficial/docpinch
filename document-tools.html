<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DocPinch document tools for scanning and enhancing document images.">
    <title>Document Tools - DocPinch</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .category-page {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .category-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 32px 24px;
            margin-bottom: 24px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            text-align: center;
        }

        .category-card h1 {
            margin: 0 0 12px;
            color: #003366;
            font-size: 34px;
        }

        .category-card p {
            color: #6f7b88;
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 28px;
        }

        .tool-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .tool-link {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 64px;
            padding: 14px 18px;
            background: #eef7ff;
            color: #2467bd;
            border-radius: 14px;
            text-decoration: none;
            font-size: 17px;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .tool-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
        }

        .back-home {
            display: inline-block;
            margin-top: 22px;
            color: #2467bd;
            font-weight: 600;
            text-decoration: underline;
        }

        @media (max-width: 650px) {
            .category-page {
                padding: 12px;
            }

            .category-card {
                padding: 25px 16px;
            }

            .category-card h1 {
                font-size: 28px;
            }

            .category-card p {
                font-size: 16px;
            }

            .tool-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <div>
        <h2>&#128196; DocPinch</h2>
        <p>PDF &amp; Image Tools</p>
    </div>
</header>

<main class="category-page">

    <section class="category-card">

        <h1>Document Tools</h1>

        <p>
            Scan documents and enhance document images for cleaner,
            easier-to-read results with DocPinch.
        </p>

        <div class="tool-list">

            <a class="tool-link" href="document-scanner.html">
                Document Scanner
            </a>

            <a class="tool-link" href="document-enhance.html">
                Document Enhance
            </a>

        </div>

        <a class="back-home" href="index.html">
            &larr; B&larr; Back to Home
        </a>

    </section>

</main>

<footer>
    &copy; 2026 DocPinch. All Rights Reserved.
</footer>

</body>
</html>
