<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DocPinch – Free PDF & Image Tools Online</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <!-- SEO Description -->
    <meta
        name="description"
        content="DocPinch offers free online PDF and image tools to compress, convert, merge, resize, crop, rotate, scan and enhance documents and images."
    >

    <!-- Referrer -->
    <meta
        name="referrer"
        content="strict-origin-when-cross-origin"
    >

    <!-- Search Engine -->
    <meta
        name="robots"
        content="index, follow"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- PDF-LIB -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

    <!-- OpenCV.js -->
    <script async src="https://docs.opencv.org/4.x/opencv.js"></script>

</head>

<body>

    <!-- HEADER -->
    <header>

        <!-- LOGO -->
        <div class="brand">
            <img
                src="logo.svg"
                alt="DocPinch Logo"
            >
        </div>

        <!-- NAVIGATION -->
        <nav class="navbar">
            <a href="index.html">Home</a>

            <a href="index.html?nav=tools#tools">
                Tools
            </a>

            <a href="index.html?nav=about#about">
                About
            </a>
        </nav>

    </header>


    <!-- MAIN -->
    <main>

        <!-- TOOLS -->
        <h2>Choose a Tool</h2>

        <div class="tools" id="tools">

            <button>
                📄 Compress PDF
            </button>

            <button>
                🖼️ Compress Image
            </button>

            <button>
                🔄 JPG/PNG → PDF
            </button>

            <button>
                🔗 Merge PDF
            </button>

            <button>
                🖼️ PDF → JPG/PNG
            </button>

            <button>
                📐 Document Scanner
            </button>

            <button>
                ✨ Document Enhance
            </button>

            <button>
                📏 Resize Image
            </button>

            <button>
                ✂️ Crop Image
            </button>

            <button>
                🔃 Rotate Image
            </button>

        </div>


        <!-- ABOUT -->
        <section
            id="about"
            class="about"
        >

            <h2>About DocPinch</h2>

            <p>
                DocPinch is a free online platform for PDF and image tools.
                Compress, convert, merge, resize, crop, rotate, scan and
                enhance your documents and images easily.
            </p>

        </section>

    </main>


    <!-- FOOTER -->
    <footer>

        <p>
            © 2026 DocPinch. All Rights Reserved.
        </p>

        <p class="footer-tagline">
            Free Online PDF & Image Tools
        </p>

    </footer>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
